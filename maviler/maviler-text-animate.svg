  <title>Maviler Text Animated</title>
  <style>
    .maviler-text-path {
      fill: #134393;
      fill-opacity: 0;
      stroke: #134393;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-opacity: 1;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawAndFill 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes drawAndFill {
      0% {
        stroke-dashoffset: 1000;
        stroke-opacity: 1;
        fill-opacity: 0;
      }
      65% {
        stroke-dashoffset: 0;
        stroke-opacity: 1;
        fill-opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        stroke-opacity: 0;
        fill-opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .maviler-text-path {
        animation: none;
        stroke-dashoffset: 0;
        stroke-opacity: 0;
        fill-opacity: 1;
      }
    }
  </style>
